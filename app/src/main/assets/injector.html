<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paglu AI Pro Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(15,15,25,0.96) 0%, rgba(5,5,10,0.98) 100%);
            border-radius: 50%;
            border: 3px solid transparent;
            background-image: linear-gradient(radial(circle), rgba(15,15,25,0.96), rgba(5,5,10,0.98)), linear-gradient(135deg, #00f2fe, #4facfe, #ff0844, #ffb199);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 8, 68, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            position: relative;
        }
        .header-tag {
            font-size: 8px;
            letter-spacing: 1px;
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
            padding: 1px 6px;
            border-radius: 8px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .period-row {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-bottom: 2px;
        }
        .period-input {
            background: #111;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 4px;
            width: 115px;
            text-align: center;
            font-family: monospace;
            outline: none;
        }
        .set-btn {
            background: #00f2fe;
            color: #111;
            border: none;
            font-size: 8px;
            font-weight: bold;
            padding: 3px 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .prediction-box {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 1px 0;
        }
        .prediction-value {
            font-size: 19px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .big-text { color: #00ff88; text-shadow: 0 0 8px rgba(0,255,136,0.6); }
        .small-text { color: #ff3366; text-shadow: 0 0 8px rgba(255,51,102,0.6); }
        
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff88;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        .digit-title {
            font-size: 7px;
            color: #888;
            letter-spacing: 0.5px;
        }
        .digit-value {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 6px rgba(255,204,0,0.6);
        }
        .status-bar {
            font-size: 8px;
            color: #00f2fe;
            border-top: 1px dashed rgba(255,255,255,0.15);
            padding-top: 2px;
            margin-top: 2px;
            width: 75%;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .btn {
            font-size: 8px;
            padding: 2px 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-hide { background: #ffcc00; color: #111; }
        .btn-exit { background: #ff3366; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-tag">Paglu AI Pro</div>
        
        <div class="period-row">
            <input type="text" id="periodInput" class="period-input" placeholder="Enter Period" 
                   onfocus="requestFocus(true)" onblur="requestFocus(false)">
            <button class="set-btn" onclick="setManualPeriod()">SET</button>
        </div>
        
        <div class="prediction-box">
            <span class="prediction-value" id="predValue">--</span>
            <div class="status-dot"></div>
        </div>

        <div class="digit-title">AI PREDICTED DIGIT</div>
        <div class="digit-value" id="digitValue">-</div>

        <div class="status-bar" id="statusBar">Status: Active & Locked</div>

        <div class="btn-row">
            <button class="btn btn-hide" onclick="minimizeApp()">HIDE</button>
            <button class="btn btn-exit" onclick="exitApp()">EXIT</button>
        </div>
    </div>

    <script>
        let basePeriodNumber = 0;

        function requestFocus(isFocus) {
            if (window.Android && typeof window.Android.requestFocusable === "function") {
                window.Android.requestFocusable(isFocus);
            }
        }

        function setManualPeriod() {
            let val = document.getElementById("periodInput").value.trim();
            if(!isNaN(val) && val.length > 5) {
                basePeriodNumber = parseInt(val);
                document.getElementById("periodInput").blur();
            }
        }

        function updateEngine() {
            const now = new Date();
            const currentSecond = now.getSeconds();
            const timeLeft = 30 - (currentSecond % 30);

            if (basePeriodNumber > 0) {
                let currentInterval = Math.floor(now.getTime() / 30000);
                if (window.lastInterval && window.lastInterval !== currentInterval) {
                    basePeriodNumber += 1;
                }
                window.lastInterval = currentInterval;
            }

            let displayPeriod = basePeriodNumber > 0 ? basePeriodNumber : "Enter Period";
            if(document.activeElement !== document.getElementById("periodInput")) {
                document.getElementById("periodInput").placeholder = displayPeriod;
            }

            if (basePeriodNumber > 0) {
                let hash = 0;
                let pStr = basePeriodNumber.toString();
                for (let i = 0; i < pStr.length; i++) {
                    hash = ((hash << 5) - hash) + pStr.charCodeAt(i);
                    hash |= 0;
                }
                let pseudoRandom = Math.abs(Math.sin(hash)) * 1000;
                let remainder = Math.floor(pseudoRandom % 10);

                let isBig = remainder >= 5;
                let predEl = document.getElementById("predValue");
                let digitEl = document.getElementById("digitValue");

                predEl.innerText = isBig ? "BIG" : "SMALL";
                predEl.className = "prediction-value " + (isBig ? "big-text" : "small-text");
                digitEl.innerText = remainder;
            }
        }

        setInterval(updateEngine, 1000);
        updateEngine();

        function minimizeApp() {
            if (window.Android && typeof window.Android.minimizePanel === "function") {
                window.Android.minimizePanel();
            }
        }

        function exitApp() {
            if (window.Android && typeof window.Android.closeApp === "function") {
                window.Android.closeApp();
            }
        }
    </script>
</body>
</html>
