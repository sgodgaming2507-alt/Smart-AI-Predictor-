<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paglu AI Pro Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, rgba(15,15,25,0.96) 0%, rgba(5,5,10,0.98) 100%);
            border-radius: 50%;
            border: 3px solid transparent;
            background-image: linear-gradient(radial(circle), rgba(15,15,25,0.96), rgba(5,5,10,0.98)), linear-gradient(135deg, #00f2fe, #4facfe, #ff0844, #ffb199);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 8, 68, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            position: relative;
        }
        .header-tag {
            font-size: 8px;
            letter-spacing: 1px;
            color: #00f2fe;
            border: 1px solid rgba(0, 242, 254, 0.4);
            padding: 1px 6px;
            border-radius: 8px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .period-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 2px;
        }
        .period-text {
            font-size: 9px;
            color: #00f2fe;
            font-family: monospace;
            font-weight: bold;
        }
        .adj-btn {
            background: #222;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            font-size: 8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }
        .prediction-box {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 1px 0;
        }
        .prediction-value {
            font-size: 19px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .big-text { color: #00ff88; text-shadow: 0 0 8px rgba(0,255,136,0.6); }
        .small-text { color: #ff3366; text-shadow: 0 0 8px rgba(255,51,102,0.6); }
        
        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff88;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        .digit-title {
            font-size: 7px;
            color: #888;
            letter-spacing: 0.5px;
        }
        .digit-value {
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 6px rgba(255,204,0,0.6);
        }
        .status-bar {
            font-size: 8px;
            color: #00f2fe;
            border-top: 1px dashed rgba(255,255,255,0.15);
            padding-top: 2px;
            margin-top: 2px;
            width: 75%;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .btn {
            font-size: 8px;
            padding: 2px 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-hide { background: #ffcc00; color: #111; }
        .btn-exit { background: #ff3366; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-tag">Paglu AI Pro</div>
        
        <div class="period-row">
            <button class="adj-btn" onclick="changePeriod(-1)">-</button>
            <span class="period-text" id="periodDisplay">PER: Loading...</span>
            <button class="adj-btn" onclick="changePeriod(1)">+</button>
        </div>
        
        <div class="prediction-box">
            <span class="prediction-value" id="predValue">--</span>
            <div class="status-dot"></div>
        </div>

        <div class="digit-title">AI PREDICTED DIGIT</div>
        <div class="digit-value" id="digitValue">-</div>

        <div class="status-bar" id="statusBar">Status: Active & Stable</div>

        <div class="btn-row">
            <button class="btn btn-hide" onclick="minimizeApp()">HIDE</button>
            <button class="btn btn-exit" onclick="exitApp()">EXIT</button>
        </div>
    </div>

    <script>
        let manualOffset = 0;

        function changePeriod(val) {
            manualOffset += val;
        }

        function updateEngine() {
            const now = new Date();
            // UTC to IST time adjustment (+5:30)
            const istTime = new Date(now.getTime() + (330 + now.getTimezoneOffset()) * 60000);
            
            const year = istTime.getFullYear();
            const month = String(istTime.getMonth() + 1).padStart(2, '0');
            const day = String(istTime.getDate()).padStart(2, '0');
            
            const hours = istTime.getHours();
            const minutes = istTime.getMinutes();
            const seconds = istTime.getSeconds();
            
            // Total 30-second intervals passed today
            const totalIntervals = (hours * 120) + (minutes * 2) + Math.floor(seconds / 30);
            
            const baseNumber = parseInt(`${year}${month}${day}1000500000`) + totalIntervals + manualOffset;
            
            document.getElementById("periodDisplay").innerText = `PER: ${baseNumber}`;

            // Smart prediction logic
            let hash = 0;
            let pStr = baseNumber.toString();
            for (let i = 0; i < pStr.length; i++) {
                hash = ((hash << 5) - hash) + pStr.charCodeAt(i);
                hash |= 0;
            }
            let pseudoRandom = Math.abs(Math.sin(hash)) * 1000;
            let remainder = Math.floor(pseudoRandom % 10);

            let isBig = remainder >= 5;
            let predEl = document.getElementById("predValue");
            let digitEl = document.getElementById("digitValue");

            predEl.innerText = isBig ? "BIG" : "SMALL";
            predEl.className = "prediction-value " + (isBig ? "big-text" : "small-text");
            digitEl.innerText = remainder;
        }

        setInterval(updateEngine, 1000);
        updateEngine();

        function minimizeApp() {
            if (window.Android && typeof window.Android.minimizePanel === "function") {
                window.Android.minimizePanel();
            }
        }

        function exitApp() {
            if (window.Android && typeof window.Android.closeApp === "function") {
                window.Android.closeApp();
            }
        }
    </script>
</body>
</html>
